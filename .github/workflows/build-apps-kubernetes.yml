name: build-apps-kubernetes

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'versions/**'
      - 'hack/**'
      - 'packaging/**'
      - 'configs/**'
      - '.github/workflows/build-apps-kubernetes.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Kubernetes version manifest
        required: true
        default: v1.36.4
      arch:
        description: Target architecture
        required: true
        type: choice
        options: [amd64, arm64]
        default: amd64
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'versions/**'
      - 'hack/**'
      - 'packaging/**'
      - '.github/workflows/build-apps-kubernetes.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: ./hack/static-check.sh

  build:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version || 'v1.36.4' }}
      ARCH: ${{ inputs.arch || 'amd64' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah file tree

      - name: Install pinned Sealos
        run: ./hack/install-sealos.sh

      - name: Preflight
        run: ./hack/check-tools.sh

      - name: Build Kubernetes payload
        run: ./hack/build-kubernetes-payload.sh

      - name: Build pinned runtime bundle
        run: ./hack/build-runtime-bundle.sh

      - name: Build cluster image
        run: ./hack/build-cluster-image.sh

      - name: Build offline package
        run: ./hack/package.sh

      - name: Verify package
        run: ./hack/verify-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apps_kubernetes-${{ env.VERSION }}-linux-${{ env.ARCH }}
          path: dist/apps_kubernetes-*.tar.gz
          if-no-files-found: error
